name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not attach files containing private data; a small
        anonymised sample that reproduces the problem is ideal.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Groundwork version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: OS version
      placeholder: Windows 11 23H2 / macOS 14.5 / Ubuntu 24.04
  - type: input
    id: fileinfo
    attributes:
      label: File type and size, if a file is involved
      placeholder: KMZ, 40 MB, about 200,000 placemarks
