[package]
name = "groundwork"
version = "0.1.0"
description = "Local-first desktop globe for viewing, measuring, and editing your own geodata"
edition = "2021"

[lib]
name = "groundwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
